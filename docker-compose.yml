# The course app.
#
# Caddy on this host terminates TLS and proxies to ml:8000 over the shared
# `edge` network, the same way the other services here are reached. This bundle
# must never publish 80 or 443 itself.
#
#   docker compose up -d
#
# This is an example. GitHub Actions builds the image on every merge to main and
# pushes it to ghcr.io/weights-and-wires/ml; the VM runs `deploy ml`, which
# pulls the new image and restarts the container. The image carries the PDF
# book, so no book folder is mounted.

name: ml

services:
  app:
    image: ghcr.io/weights-and-wires/ml:latest
    container_name: ml
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      # Localhost only. Caddy reaches the container over `edge`, so this is not
      # a route in from outside; it exists so the app can be reached through an
      # SSH tunnel before its DNS record resolves:
      #   ssh -L 8093:127.0.0.1:8093 ifkash@vm.ifkash.dev
      - "127.0.0.1:8093:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      # Set here so this example overrides env_file.
      LOCAL_WORKERS: "2"
    volumes:
      - ml-data:/data
    networks:
      - edge
    # A reader's submission is a subprocess inside this container, so cap what
    # the container as a whole can take from the host.
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ml-data:

networks:
  edge:
    external: true
